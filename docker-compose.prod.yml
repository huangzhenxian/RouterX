# RouteX 生产部署。单 VPS 全栈：管理后台 + Xray 入口 + DB/Redis 都在这里。
# 用法见 deploy/README-prod.md
#
# 启动：
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# 查看日志：
#   docker compose -f docker-compose.prod.yml logs -f --tail=200
# 停（保留数据）：
#   docker compose -f docker-compose.prod.yml down
# 全清（含 DB 数据卷，慎用）：
#   docker compose -f docker-compose.prod.yml down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: routex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-routex}
      POSTGRES_USER: ${POSTGRES_USER:-routex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 不对外暴露端口；只后端容器走 docker 网络访问

  redis:
    image: redis:7-alpine
    container_name: routex-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  xray:
    image: teddysun/xray:latest
    container_name: routex-xray
    restart: unless-stopped
    ports:
      # 客户端 VLESS+Reality 入站。dev 用 8895，生产建议改成 "443:443"
      - "${PUBLIC_PORT:-8895}:443"
    volumes:
      # ⚠️ 必须先存在并填好真实 privateKey
      - ./deploy/xray/config.json:/etc/xray/config.json:ro
      - xray_logs:/var/log/xray
    command: ["xray", "run", "-config", "/etc/xray/config.json"]
    # gRPC API 10085 只在 docker 网络内可达，绝不对外暴露

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: routex/server:latest
    container_name: routex-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      xray:
        condition: service_started
    env_file: .env
    environment:
      # 容器互联用 docker DNS（service 名），覆盖 .env 里给本机开发用的 127.0.0.1
      APP_ENV:        prod
      POSTGRES_HOST:  postgres
      POSTGRES_PORT:  "5432"
      REDIS_HOST:     redis
      REDIS_PORT:     "6379"
      XRAY_API_HOST:  xray
      XRAY_API_PORT:  "10085"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: routex/web:latest
    container_name: routex-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      # 管理面板入口。要 HTTPS 建议外面再套一个 Caddy / 反向代理。
      - "${WEB_PORT:-80}:80"

volumes:
  postgres_data:
  redis_data:
  xray_logs:
