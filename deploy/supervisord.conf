; supervisord 在单镜像里编排两个进程：Go 后端 + nginx 前端。
; 任一进程崩溃都会被自动拉起；两者日志都打到各自 stdout，由 docker logs 收集。
; 容器以 supervisord 为 PID 1，它负责转发 SIGTERM 给子进程做优雅退出。

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; Go 控制面：崩了尽快拉起，优先级高于 nginx（先起后端再起前端反代）。
[program:server]
command=/app/server
directory=/app
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10

; nginx：以前台模式跑（daemon off），日志走 stdout。
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
startretries=5
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stopasgroup=true
killasgroup=true
stopsignal=QUIT
stopwaitsecs=10
