# nginx 在 routex-web 容器里同时干两件事：
#   1. 把 /v1/* 反向代理到后端 routex-server:8891（同源，避开 CORS）
#   2. 把其他路径当 SPA 处理：静态文件 + 找不到时回 index.html（react-router 用）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 8m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    # 后端 API
    location /v1/ {
        proxy_pass http://server:8891;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 静态资源走强缓存
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback：找不到的 GET 回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
