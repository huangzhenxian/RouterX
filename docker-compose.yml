services:
  postgres:
    image: postgres:16-alpine
    container_name: routex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-routex}
      POSTGRES_USER: ${POSTGRES_USER:-routex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routex_dev_pwd}
    ports:
      - "8892:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 注：不挂载 ./migrations 当 initdb 脚本，避免与 GORM AutoMigrate 冲突。
      # migrations/*.sql 仅作 schema 参考文档使用。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routex}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: routex-redis
    restart: unless-stopped
    ports:
      - "8893:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  xray:
    image: teddysun/xray:latest
    container_name: routex-xray
    restart: unless-stopped
    ports:
      - "8894:10085"    # Xray gRPC API
      - "8895:443"      # VLESS + Reality 入站（生产可改成 443:443）
    volumes:
      - ./deploy/xray/config.json:/etc/xray/config.json:ro
      - xray_logs:/var/log/xray
    command: ["xray", "run", "-config", "/etc/xray/config.json"]

  sing-box:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: routex-singbox
    restart: unless-stopped
    ports:
      - "8896:9090"     # Clash API / sing-box API
    volumes:
      - ./deploy/sing-box/config.json:/etc/sing-box/config.json:ro
    command: ["run", "-c", "/etc/sing-box/config.json"]

volumes:
  postgres_data:
  redis_data:
  xray_logs:
