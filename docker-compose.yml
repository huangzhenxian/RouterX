services:
  postgres:
    image: postgres:16-alpine
    container_name: routex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-routex}
      POSTGRES_USER: ${POSTGRES_USER:-routex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routex_dev_pwd}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routex}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: routex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  xray:
    image: teddysun/xray:latest
    container_name: routex-xray
    restart: unless-stopped
    ports:
      - "10085:10085"   # Xray gRPC API
      - "443:443"       # VLESS + Reality (示例)
    volumes:
      - ./deploy/xray/config.json:/etc/xray/config.json:ro
      - xray_logs:/var/log/xray
    command: ["xray", "run", "-config", "/etc/xray/config.json"]

  sing-box:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: routex-singbox
    restart: unless-stopped
    ports:
      - "9090:9090"     # Clash API / sing-box API
    volumes:
      - ./deploy/sing-box/config.json:/etc/sing-box/config.json:ro
    command: ["run", "-c", "/etc/sing-box/config.json"]

  # 后端和前端先不放进 compose，本地开发用 go run / npm run dev 更顺手
  # 真正部署前再补一个 server/Dockerfile 和 web/Dockerfile

volumes:
  postgres_data:
  redis_data:
  xray_logs:
